<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>History — CareerCompass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/shared.css" />
  <link rel="stylesheet" href="/static/css/student.css" />
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand d-flex align-items-center gap-2">
    <img src="{{ url_for('careercompass_logo') }}" alt="CareerCompass logo" class="brand-logo-full" style="height:36px" />
    <div><div class="fw-bold small lh-1">CareerCompass</div><div class="text-secondary" style="font-size:.65rem;margin-top:2px">Student Portal</div></div>
  </div>
  <div class="sidebar-user">
    <div class="d-flex align-items-center gap-2">
      <div class="sidebar-avatar">MS</div>
      <div><div class="fw-semibold" style="font-size:.78rem">Maria Santos</div><div class="text-secondary" style="font-size:.68rem">BSIT-3A · 3rd Year</div></div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-label">Menu</div>
    <a class="nav-item-cc" href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a class="nav-item-cc" href="assessment.html"><i class="bi bi-clipboard-check"></i> Career Assessment</a>
    <a class="nav-item-cc" href="recommendation.html"><i class="bi bi-award"></i> Recommendation <span class="dot"></span></a>
    <a class="nav-item-cc active" href="history.html"><i class="bi bi-clock-history"></i> History</a>
    <a class="nav-item-cc" href="profile.html"><i class="bi bi-person"></i> Profile</a>
  </nav>
  <div class="sidebar-footer"><a class="nav-item-cc" href="../index.html" style="color:#EF4444!important"><i class="bi bi-box-arrow-left" style="color:#EF4444"></i> Logout</a></div>
</div>

<div class="sidebar-main">
  <div class="topbar">
    <div><div class="fw-bold" style="font-size:1.05rem">Assessment History</div><div class="text-secondary small">Track all your previous career assessments and results.</div></div>
    <div class="topbar-avatar">MS</div>
  </div>

  <div class="p-4">
    <div class="card-cc">
      <div class="p-3 border-bottom d-flex gap-3 align-items-center">
        <div class="position-relative" style="max-width:280px;flex:1">
          <i class="bi bi-search position-absolute text-secondary" style="top:50%;left:12px;transform:translateY(-50%);font-size:.85rem"></i>
          <input type="text" class="form-control ps-5" placeholder="Search by career..." style="border-radius:10px;background:#F9FAFB;font-size:.875rem" id="history-search" oninput="renderHistory()" />
        </div>
        <select class="form-select w-auto" style="border-radius:10px;background:#F9FAFB;font-size:.875rem" id="history-filter" onchange="renderHistory()">
          <option value="">All Careers</option>
          <option>Software Engineering</option>
          <option>Web Development</option>
          <option>Data Science</option>
          <option>Cybersecurity</option>
          <option>Networking</option>
        </select>
        <button class="btn btn-sm ms-auto d-flex align-items-center gap-2" style="border:1px solid var(--border);font-size:.875rem"><i class="bi bi-download"></i> Export</button>
      </div>
      <div class="table-responsive">
        <table class="table table-cc mb-0">
          <thead><tr><th>Date</th><th>Recommended Career</th><th>Match Score</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="history-tbody"></tbody>
        </table>
      </div>
      <div class="p-3 border-top d-flex justify-content-between align-items-center">
        <span class="text-secondary small" id="history-count">Showing 5 of 5 results</span>
        <div class="d-flex gap-1"><button class="btn btn-sm" style="width:32px;height:32px;background:var(--indigo);color:#fff;border-radius:8px;font-size:.75rem;font-weight:600">1</button></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/student.js"></script>
</body>
</html>
