<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Settings — CareerCompass Faculty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/shared.css" />
  <link rel="stylesheet" href="/static/css/faculty.css" />
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand d-flex align-items-center gap-2">
    <img src="{{ url_for('careercompass_logo') }}" alt="CareerCompass logo" class="brand-logo-full" style="height:36px" />
    <div><div class="fw-bold small lh-1">CareerCompass</div><div class="text-secondary" style="font-size:.65rem;margin-top:2px">Faculty Portal</div></div>
  </div>
  <div class="sidebar-user sidebar-user-faculty">
    <div class="d-flex align-items-center gap-2">
      <div class="sidebar-avatar sidebar-avatar-faculty">JD</div>
      <div><div class="fw-semibold" style="font-size:.78rem">Dr. Juan Dela Cruz</div><div class="text-secondary" style="font-size:.68rem">Faculty &mdash; CCIT</div></div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-label">Faculty Menu</div>
    <a class="nav-item-cc" href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a class="nav-item-cc " href="students.html"><i class="bi bi-people"></i> Students</a>
    <a class="nav-item-cc" href="reports.html"><i class="bi bi-file-text"></i> Reports</a>
    <a class="nav-item-cc " href="recommendations.html"><i class="bi bi-award"></i> Recommendations</a>
    <a class="nav-item-cc " href="settings.html"><i class="bi bi-gear"></i> Settings</a>
  </nav>
  <div class="sidebar-footer"><a class="nav-item-cc" href="../index.html" style="color:#EF4444!important"><i class="bi bi-box-arrow-left" style="color:#EF4444"></i> Logout</a></div>
</div>
<div class="sidebar-main">
  <div class="topbar"><div><div class="fw-bold" style="font-size:1.05rem">Settings</div></div><div class="topbar-avatar" style="background:#EDE9FE;color:#5B21B6">JD</div></div>
  <div class="p-4"><div class="row g-4"><div class="col-lg-6"><div class="card-cc p-4"><h5>Faculty Profile</h5><label class="form-label small mt-2">Name</label><input id="faculty-name" class="form-control"><label class="form-label small mt-3">School Email</label><input id="faculty-email" class="form-control" readonly><label class="form-label small mt-3">Phone</label><input id="faculty-phone" class="form-control"><button class="btn btn-indigo mt-3" onclick="saveFacultySettings()">Save profile</button></div></div><div class="col-lg-6"><div class="card-cc p-4"><h5>Change Password</h5><label class="form-label small mt-2">Current password</label><input id="current-password" type="password" class="form-control"><label class="form-label small mt-3">New password</label><input id="new-password" type="password" class="form-control" minlength="8"><button class="btn btn-indigo mt-3" onclick="changeFacultyPassword()">Update password</button><p id="settings-message" class="small text-secondary mt-3 mb-0"></p></div></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
