<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CareerCompass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/shared.css" />
  <style>
    body { background:radial-gradient(circle at 12% 16%,rgba(196,181,253,.32),transparent 27%),radial-gradient(circle at 88% 85%,rgba(224,231,255,.75),transparent 33%),#FAFAFF; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-shell { width:100%;max-width:440px;padding:32px 20px; }
    .login-card { border-color:#E5E3FF;box-shadow:0 18px 44px rgba(49,46,129,.10);border-radius:18px;overflow:hidden; }
    .role-toggle { background:#F4F3FF; border-radius:12px; padding:4px; display:flex; gap:2px; }
    .role-btn { flex:1; border:none; border-radius:9px; padding:10px 16px; font-size:.875rem; font-weight:600; color:#6B7280; background:transparent; cursor:pointer; transition:all .15s; }
    .role-btn.active { background:#fff; color:var(--indigo-dark); box-shadow:0 2px 7px rgba(79,70,229,.12); }
    .login-card .form-control { min-height:46px;border-color:#E1E3EF;box-shadow:none; }.login-card .form-control:focus { border-color:#818CF8;box-shadow:0 0 0 .2rem rgba(99,102,241,.12); }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="text-center mb-4">
      <img src="{{ url_for('careercompass_logo') }}" alt="CareerCompass logo" class="brand-logo-full mx-auto" style="height:78px;margin-bottom:16px" />
      <h2 class="fw-bold mb-1">CareerCompass</h2>
      <p class="text-secondary small mb-0">NLP-Based IT Career Path Recommendation</p>
    </div>
    <div class="card-cc login-card">
      <div style="height:5px;background:linear-gradient(90deg,#4F46E5,#7C3AED);border-radius:var(--radius) var(--radius) 0 0"></div>
      <div class="p-4">
        <div class="d-flex align-items-center gap-3 pb-4 mb-4 border-bottom">
          <div style="width:40px;height:40px;border-radius:50%;background:#F3F4F6;border:2px solid #E5E7EB;display:flex;align-items:center;justify-content:center"><i class="bi bi-mortarboard text-secondary"></i></div>
          <div><div class="fw-semibold small">College of Computer Science</div><div class="text-secondary" style="font-size:.78rem">Career guidance portal</div></div>
        </div>
        <div class="role-toggle mb-4" id="role-toggle">
          <button class="role-btn active" id="role-student" onclick="setRole('student')">Student</button>
          <button class="role-btn" id="role-faculty" onclick="setRole('faculty')">Faculty</button>
        </div>
        <form onsubmit="handleLogin(event)">
          <div class="mb-3" id="email-group"><label class="form-label fw-medium small" id="email-label">Email Address</label><input type="email" class="form-control" id="login-email" placeholder="Enter your student email address" autocomplete="email" style="border-radius:10px;background:#F9FAFB" /></div>
          <div id="name-group" class="mb-3 d-none"><label class="form-label fw-medium small">Full Name</label><input type="text" class="form-control" id="account-name" placeholder="Juan Dela Cruz" style="border-radius:10px;background:#F9FAFB" /></div>
          <div id="verification-info" class="d-none text-center mb-4"><div class="stat-icon bg-indigo-light text-indigo mx-auto mb-2"><i class="bi bi-envelope-check"></i></div><div class="fw-semibold">Check your email</div><div class="text-secondary small">We sent a 6-digit code to <span id="verification-email" class="fw-medium"></span>.</div></div>
          <div id="code-group" class="mb-3 d-none"><label class="form-label fw-medium small">Verification Code</label><input inputmode="numeric" maxlength="6" class="form-control" id="verification-code" placeholder="6-digit code" style="border-radius:10px;background:#F9FAFB" /></div>
          <div class="mb-4" id="password-group">
            <div class="d-flex justify-content-between align-items-center mb-1"><label class="form-label fw-medium small mb-0" id="password-label">Password</label><a href="#" class="text-indigo small" id="forgot-link" onclick="showForgot();return false">Forgot password?</a></div>
            <input type="password" class="form-control" id="login-password" placeholder="Enter your password" style="border-radius:10px;background:#F9FAFB" />
          </div>
          <div id="auth-error" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>
          <button type="submit" class="btn btn-indigo w-100 py-2" id="login-btn">Sign In as Student</button>
          <div id="verification-actions" class="d-none text-center mt-3"><button type="button" class="btn btn-link btn-sm text-indigo" onclick="resendCode()">Resend code</button><span class="text-secondary">·</span><button type="button" class="btn btn-link btn-sm text-secondary" onclick="returnToDetails()">Use a different email</button></div>
        </form>
        <div class="text-center mt-3">
          <button type="button" class="btn btn-link p-0 text-indigo small" id="auth-switch" onclick="toggleAuthMode()">Create an account</button>
        </div>
        <div id="forgot-box" class="mt-3 p-3 rounded-3 d-none" style="background:var(--indigo-light);border:1px solid #C7D2FE">
          <div class="fw-semibold small text-indigo mb-1">Password Reset</div>
          <div class="text-indigo small mb-2">Enter your email address to receive a reset code.</div>
          <button class="btn btn-sm btn-indigo" onclick="startReset()">Send reset code</button>
        </div>
      </div>
    </div>
    <div class="text-center mt-3">
      <a href="index.html" class="btn btn-sm text-secondary d-inline-flex align-items-center gap-1"><i class="bi bi-chevron-left"></i> Back to home</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var currentRole = 'student';
    var authMode = 'signin';
    var verificationSent = false;
    var resetMode = false;

    function setRole(r) {
      currentRole = r;
      document.getElementById('role-student').classList.toggle('active', r === 'student');
      document.getElementById('role-faculty').classList.toggle('active', r === 'faculty');
      document.getElementById('email-label').textContent = 'Email Address';
      document.getElementById('login-email').placeholder = r === 'student' ? 'Enter your student email address' : 'Enter your faculty email address';
      updateAuthUi();
    }

    function updateAuthUi() {
      var isCreate = authMode === 'create';
      var verifying = verificationSent || resetMode;
      document.getElementById('role-toggle').classList.toggle('d-none', verifying);
      document.getElementById('email-group').classList.toggle('d-none', verifying);
      document.getElementById('name-group').classList.toggle('d-none', !isCreate || verifying);
      document.getElementById('verification-info').classList.toggle('d-none', !verifying);
      document.getElementById('verification-email').textContent = document.getElementById('login-email').value || 'your email address';
      document.getElementById('code-group').classList.toggle('d-none', !verifying);
      document.getElementById('password-group').classList.toggle('d-none', isCreate && !verificationSent);
      document.getElementById('forgot-link').classList.toggle('d-none', isCreate || verifying);
      document.getElementById('password-label').textContent = verifying ? (resetMode ? 'New Password' : 'Create Password') : 'Password';
      document.getElementById('login-password').placeholder = verifying ? 'At least 8 characters' : 'Enter your password';
      document.getElementById('login-btn').textContent = resetMode ? 'Reset Password' : verificationSent ? 'Verify Code & Create Password' : isCreate ? 'Send Verification Code' : 'Sign In';
      document.getElementById('auth-switch').textContent = isCreate ? 'Already have an account? Sign in' : 'Create an account';
      document.getElementById('auth-switch').classList.toggle('d-none', verifying);
      document.getElementById('verification-actions').classList.toggle('d-none', !verifying);
      document.getElementById('login-btn').disabled = false;
    }

    function toggleAuthMode() {
      authMode = authMode === 'signin' ? 'create' : 'signin';
      verificationSent = false; resetMode = false;
      document.getElementById('auth-error').classList.add('d-none');
      updateAuthUi();
    }

    function showAuthError(message) {
      var box = document.getElementById('auth-error');
      box.textContent = message;
      box.classList.remove('d-none');
    }

    function clearAuthError() {
      document.getElementById('auth-error').classList.add('d-none');
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearAuthError();
      var identifier = (document.getElementById('login-email').value || '').trim();
      var password = (document.getElementById('login-password').value || '').trim();
      var name = (document.getElementById('account-name').value || '').trim();
      var needsCode = resetMode || verificationSent;
      if (!identifier || (authMode === 'create' && !verificationSent && !name) || (needsCode && (!password || !document.getElementById('verification-code').value.trim())) || (!needsCode && authMode === 'signin' && !password)) {
        showAuthError(needsCode ? 'Enter the 6-digit code and your new password.' : authMode === 'create' ? 'Enter your name and email address.' : 'Please enter both your email address and password.');
        return;
      }
      var button = document.getElementById('login-btn');
      button.disabled = true;
      button.textContent = resetMode ? 'Resetting password...' : verificationSent ? 'Verifying code...' : authMode === 'create' ? 'Sending code...' : 'Signing in...';
      try {
        var endpoint, body;
        if (resetMode) {
          endpoint = '/api/auth/complete-password-reset'; body = { email: identifier, code: document.getElementById('verification-code').value, password: password };
        } else if (authMode === 'create' && verificationSent) {
          endpoint = '/api/auth/complete-registration'; body = { email: identifier, code: document.getElementById('verification-code').value, password: password };
        } else if (authMode === 'create') {
          endpoint = '/api/auth/request-verification'; body = { name: name, email: identifier, role: currentRole };
        } else { endpoint = '/api/auth/login'; body = { identifier: identifier, password: password, role: currentRole }; }
        var response = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        var payload = await response.json();
        if (!response.ok || !payload.ok) throw new Error(payload.error || 'Unable to complete the request.');
        if (authMode === 'create' && !verificationSent) { verificationSent = true; document.getElementById('login-password').value = ''; updateAuthUi(); return; }
        if (resetMode || verificationSent) { authMode = 'signin'; verificationSent = false; resetMode = false; document.getElementById('login-password').value = ''; document.getElementById('verification-code').value = ''; updateAuthUi(); alert(payload.message || 'Complete. Please sign in.'); return; }
        localStorage.setItem('careerCompassAuth', JSON.stringify({ role: payload.user.role, user: payload.user }));
        window.location.href = payload.user.role === 'faculty' || payload.user.role === 'admin' ? 'faculty/dashboard.html' : 'student/dashboard.html';
      } catch (error) {
        showAuthError(error.message || 'Unable to connect to the server.');
        button.disabled = false;
        updateAuthUi();
      }
    }

    function showForgot() {
      document.getElementById('forgot-box').classList.toggle('d-none');
    }

    function returnToDetails() {
      verificationSent = false; resetMode = false;
      document.getElementById('verification-code').value = '';
      document.getElementById('login-password').value = '';
      clearAuthError(); updateAuthUi();
    }

    async function resendCode() {
      clearAuthError();
      var email = (document.getElementById('login-email').value || '').trim();
      var name = (document.getElementById('account-name').value || '').trim();
      var endpoint = resetMode ? '/api/auth/request-password-reset' : '/api/auth/request-verification';
      var body = resetMode ? { email: email } : { name: name, email: email, role: currentRole };
      try {
        var response = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        var payload = await response.json(); if (!response.ok || !payload.ok) throw new Error(payload.error || 'Unable to resend the code.');
        alert(payload.message || 'A new code was sent.');
      } catch (error) { showAuthError(error.message || 'Unable to resend the code.'); }
    }

    async function startReset() {
      clearAuthError();
      var email = (document.getElementById('login-email').value || '').trim();
      if (!email) { showAuthError('Enter your email address first.'); return; }
      try {
        var response = await fetch('/api/auth/request-password-reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }) });
        var payload = await response.json(); if (!response.ok || !payload.ok) throw new Error(payload.error);
        authMode = 'signin'; resetMode = true; verificationSent = false; updateAuthUi(); alert(payload.message);
      } catch (error) { showAuthError(error.message || 'Unable to send a reset code.'); }
    }

    updateAuthUi();
  </script>
</body>
</html>
